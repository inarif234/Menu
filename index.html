<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Bakmi Pangsit Menteng Pulo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 0px;
        }

        /* Header Glassmorphism */
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Menu Card Styling */
        .menu-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .menu-card:active {
            transform: scale(0.96);
        }

        .img-container {
            position: relative;
            padding: 8px;
        }

        .img-container img {
            border-radius: 18px;
            aspect-ratio: 1/1;
            object-fit: cover;
            width: 100%;
        }

        /* Category Nav Styling */
        .category-pill {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Modal Animation */
        .modal-active {
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* Floating Cart */
        .floating-cart {
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4);
        }

        /* Topping Selection Custom Checkbox */
        .topping-checkbox:checked + div {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        /* Mobile specific adjustments */
        @media (max-width: 640px) {
            .container-mobile {
                max-width: 100%;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body class="text-slate-900">

    <!-- Header Area -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-header border-b border-slate-100">
        <div class="max-w-md mx-auto px-6 h-20 flex justify-between items-center">
            <div>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-0.5">Daftar</p>
                <h1 class="text-2xl font-black text-red-500 tracking-[0.05em] mb-0.05 leading-none">MENU</h1>
            </div>
            <div class="relative">
                <button onclick="openOrderModal()" class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center text-white relative active:scale-90 transition-transform">
                    <i class="fas fa-bag-shopping text-xl"></i>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold w-6 h-6 rounded-full border-4 border-white flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-md mx-auto pt-24 pb-32 px-4">

        <!-- Category Horizontal Scroll -->
        <div class="flex justify-center gap-3 pb-6 px-2" id="category-list">
            <button onclick="setActiveNav(this, 'all')" class="category-pill px-6 py-3 rounded-2xl font-bold text-sm bg-red-500 text-white shadow-lg shadow-red-100">Semua</button>
            <button onclick="setActiveNav(this, 'makanan')" class="category-pill px-6 py-3 rounded-2xl font-bold text-sm bg-white text-slate-500 border border-slate-100">Makanan</button>
            <button onclick="setActiveNav(this, 'minuman')" class="category-pill px-6 py-3 rounded-2xl font-bold text-sm bg-white text-slate-500 border border-slate-100">Minuman</button>
        </div>

        <!-- Menu Grid -->
        <div id="menu-container" class="grid grid-cols-2 gap-4">
            <!-- Items Injected by JS -->
        </div>

    </main>

    <!-- Bottom Action Button (Floating Cart Summary) -->
    <div id="sticky-cart-summary" class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-xs z-40 hidden">
        <button onclick="openOrderModal()" class="w-full bg-slate-900 text-white p-4 rounded-3xl flex justify-between items-center floating-cart transition-all active:scale-95">
            <div class="flex items-center gap-3">
                <div class="bg-red-500 w-8 h-8 rounded-xl flex items-center justify-center text-xs font-bold" id="summary-count">0</div>
                <span class="text-sm font-bold">Lihat Pesanan</span>
            </div>
            <span class="font-bold text-sm" id="summary-total">Rp 0</span>
        </button>
    </div>

    <!-- Topping Modal (Bottom Sheet Style) -->
    <div id="toppingModal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal('toppingModal')"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[40px] modal-active p-8 max-h-[85vh] overflow-y-auto">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-8"></div>
            
            <div class="text-center mb-8">
                <h3 class="text-xl font-extrabold text-slate-900">Pilihan Topping</h3>
                <p id="selected-product-name" class="text-red-500 font-bold text-sm mt-1"></p>
            </div>

            <div class="grid grid-cols-2 gap-3" id="topping-list">
                <!-- Checkbox Toppings -->
                <label class="relative cursor-pointer group">
                    <input type="checkbox" id="check-yamin" class="hidden topping-checkbox">
                    <div class="p-4 border-2 border-slate-50 rounded-3xl bg-slate-50 group-active:scale-95 transition-all text-center">
                        <span class="block font-bold text-slate-800 text-xs">Yamin</span>
                        <span class="block text-red-500 font-bold text-[10px] mt-1">+1k</span>
                    </div>
                </label>
                <label class="relative cursor-pointer group">
                    <input type="checkbox" id="check-jamur" class="hidden topping-checkbox">
                    <div class="p-4 border-2 border-slate-50 rounded-3xl bg-slate-50 group-active:scale-95 transition-all text-center">
                        <span class="block font-bold text-slate-800 text-xs">Jamur</span>
                        <span class="block text-red-500 font-bold text-[10px] mt-1">+5k</span>
                    </div>
                </label>
                <label class="relative cursor-pointer group">
                    <input type="checkbox" id="check-pangsit-rebus" class="hidden topping-checkbox">
                    <div class="p-4 border-2 border-slate-50 rounded-3xl bg-slate-50 group-active:scale-95 transition-all text-center">
                        <span class="block font-bold text-slate-800 text-xs">Pangsit Rebus</span>
                        <span class="block text-red-500 font-bold text-[10px] mt-1">+3k</span>
                    </div>
                </label>
                <label class="relative cursor-pointer group">
                    <input type="checkbox" id="check-pangsit-goreng" class="hidden topping-checkbox">
                    <div class="p-4 border-2 border-slate-50 rounded-3xl bg-slate-50 group-active:scale-95 transition-all text-center">
                        <span class="block font-bold text-slate-800 text-xs">Pangsit Goreng</span>
                        <span class="block text-red-500 font-bold text-[10px] mt-1">+5k</span>
                    </div>
                </label>
                <label class="relative cursor-pointer group">
                    <input type="checkbox" id="check-bakso-sapi" class="hidden topping-checkbox">
                    <div class="p-4 border-2 border-slate-50 rounded-3xl bg-slate-50 group-active:scale-95 transition-all text-center">
                        <span class="block font-bold text-slate-800 text-xs">Bakso Sapi</span>
                        <span class="block text-red-500 font-bold text-[10px] mt-1">+2k</span>
                    </div>
                </label>
                <label class="relative cursor-pointer group">
                    <input type="checkbox" id="check-bakso-ikan" class="hidden topping-checkbox">
                    <div class="p-4 border-2 border-slate-50 rounded-3xl bg-slate-50 group-active:scale-95 transition-all text-center">
                        <span class="block font-bold text-slate-800 text-xs">Bakso Ikan</span>
                        <span class="block text-red-500 font-bold text-[10px] mt-1">+3k</span>
                    </div>
                </label>
            </div>

            <button onclick="addWithTopping()" class="w-full mt-8 bg-red-500 text-white py-5 rounded-[24px] font-black text-sm tracking-widest uppercase shadow-xl shadow-red-100 active:scale-95 transition-all">
                Tambahkan Keranjang
            </button>
        </div>
    </div>

    <!-- Order Modal (Full Screen Overlay) -->
    <div id="orderModal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onclick="closeModal('orderModal')"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[40px] modal-active flex flex-col h-[92vh]">
            <div class="p-8 pb-4 flex justify-between items-center">
                <h3 class="text-2xl font-black text-slate-900">Pesanan saya</h3>
                <button onclick="closeModal('orderModal')" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-400">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div id="cart-items-container" class="flex-grow overflow-y-auto px-8 py-4 space-y-6">
                <!-- Cart items -->
            </div>

            <div class="p-8 bg-slate-50 rounded-t-[40px]">
                <div class="flex justify-between items-center mb-6 px-2">
                    <span class="text-slate-400 font-bold">Total Pembayaran</span>
                    <span id="cart-total-price" class="text-2xl font-black text-red-500">Rp 0</span>
                </div>
                <button onclick="sendToWhatsApp()" class="w-full bg-red-500 text-white py-5 rounded-[24px] font-black text-sm tracking-widest uppercase shadow-xl shadow-red-200 flex items-center justify-center gap-3 active:scale-95 transition-all">
                    <i class="fab fa-whatsapp text-xl"></i>
                    Kirim Pesanan
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Success -->
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-[110] bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl hidden items-center gap-3">
        <div class="w-6 h-6 bg-green-500 rounded-lg flex items-center justify-center text-[10px]">
            <i class="fas fa-check"></i>
        </div>
        <span class="text-xs font-bold">Berhasil ditambahkan!</span>
    </div>

    <!-- Footer -->
    <footer class="bg-white py-12 px-8 text-center">
        <div class="w-12 h-1 bg-slate-100 mx-auto mb-8 rounded-full"></div>
        <p class="text-slate-400 text-xs font-normal leading-relaxed">
            &copy; 2026<br>Bakmi pangsit menteng pulo
        </p>
    </footer>

    <script>
        let cart = [];
        let currentToppingProduct = null;

        const menuData = [
            {
                type: "makanan",
                items: [
                    { name: "Bakmi Ayam", price: 15000, desc: "Mie varian khas, ayam cincang dadu, sawi hijau, daun bawang dengan kuah kaldu ayam.", img: "img/bakmi-ayam.png", hasTopping: true },
                    { name: "Bakmi Bangka", price: 15000, desc: "Mie varian keriting, ayam cincang halus, sawi hijau, taoge, daun bawang dengan kuah kaldu ayam.", img: "img/bakmi-bangka.png", hasTopping: true },
                    { name: "Bakmi Lebar", price: 16000, desc: "Mie lebar khas, ayam cincang dadu, sawi hijau, daun bawang dengan kuah kaldu ayam.", img: "img/bakmi-lebar.png", hasTopping: true },
                    { name: "Kwetiau", price: 15000, desc: "Kwetiau khas, ayam cincang dadu, sawi hijau, daun bawang dengan kuah kaldu ayam.", img: "img/kwetiau.png", hasTopping: true },
                    { name: "Bihun", price: 15000, desc: "Bihun khas, ayam cincang dadu, sawi hijau, daun bawang dengan kuah kaldu ayam.", img: "img/bihun.png", hasTopping: true },
                    { name: "Pangsit Kuah", price: 18000, desc: "Pangsit rebus 10 pcs, ayam cincang dadu, sawi hijau, daun bawang dengan kuah kaldu ayam.", img: "img/pangsit-kuah.png", hasTopping: false },
                    { name: "Bakso Sapi", price: 16000, desc: "Bakso sapi 10 pcs, ayam cincang dadu, sawi hijau, daun bawang, seledri dengan kuah kaldu ayam.", img: "img/bakso-sapi.png", hasTopping: false },
                    { name: "Bakso Ikan", price: 18000, desc: "Bakso ikan 10 pcs, ayam cincang dadu, sawi hijau, daun bawang, seledri dengan kuah kaldu ayam.", img: "img/bakso-ikan.png", hasTopping: false },
                    { name: "Bakso Campur", price: 20000, desc: "Bakso ikan 5 pcs dan bakso sapi 5 pcs, ayam cincang dadu, sawi hijau, daun bawang, seledri dengan kuah kaldu ayam.", img: "img/bakso-campur.png", hasTopping: false },
                ]
            },
            {
                type: "minuman",
                items: [
                    { name: "Teh Tawar", price: 2000, desc: "Minuman teh tawar air hangat", img: "img/teh-tawar.png", hasTopping: false },
                    { name: "Teh Manis", price: 4000, desc: "Minuman teh manis air hangat", img: "img/teh-manis.png", hasTopping: false },
                    { name: "Es Teh Tawar", price: 2000, desc: "Minuman es teh tawar air dingin", img: "img/es-teh-tawar.png", hasTopping: false },
                    { name: "Es Teh Manis", price: 4000, desc: "Minuman es teh manis air dingin", img: "img/es-teh-manis.png", hasTopping: false },
                    { name: "Es Air Putih", price: 2000, desc: "Minuman es air putih dingin", img: "img/es-air-putih.png", hasTopping: false },
                    { name: "Es Good Day", price: 5000, desc: "Minuman es Good Day Cappucino dingin", img: "img/goodday-cappucino.png", hasTopping: false },
                    { name: "Kopi Hitam", price: 5000, desc: "Minuman kopi hitam air hangat", img: "img/kopi-hitam.png", hasTopping: false },
                    { name: "Air Mineral Oasis", price: 3000, desc: "Minuman botol air mineral 600 ml", img: "img/air-mineral-oasis.png", hasTopping: false },
                    { name: "Teh Pucuk", price: 5000, desc: "Minuman botol teh pucuk 350 ml", img: "img/teh-pucuk.png", hasTopping: false },
                    { name: "S-tee", price: 5000, desc: "Minuman botol s-tee 390 ml", img: "img/s-tee.png", hasTopping: false },
                ]
            }
        ];

        function formatCurrency(num) {
            return "Rp " + num.toLocaleString('id-ID');
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const summary = document.getElementById('sticky-cart-summary');
            const summaryCount = document.getElementById('summary-count');
            const summaryTotal = document.getElementById('summary-total');
            
            const totalItems = cart.reduce((acc, curr) => acc + curr.quantity, 0);
            const totalPrice = cart.reduce((acc, curr) => acc + (curr.unitPrice * curr.quantity), 0);

            badge.innerText = totalItems;
            summaryCount.innerText = totalItems;
            summaryTotal.innerText = formatCurrency(totalPrice);

            if(totalItems > 0) {
                badge.classList.remove('hidden');
                summary.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
                summary.classList.add('hidden');
            }
        }

        function renderMenu(filter = 'all') {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            menuData.forEach(group => {
                if (filter !== 'all' && group.type !== filter) return;

                group.items.forEach(item => {
                    const priceFormatted = (item.price / 1000) + "k";
                    container.innerHTML += `
                        <div onclick="handleItemClick('${item.name}', ${item.price}, ${item.hasTopping})" class="menu-card flex flex-col shadow-sm">
                            <div class="img-container">
                                <img src="${item.img}" alt="${item.name}">
                                <div class="absolute top-3 right-3 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full shadow-sm">
                                    <span class="text-[10px] font-black text-red-500 tracking-wider">${priceFormatted}</span>
                                </div>
                            </div>
                            <div class="p-4 pt-1 flex flex-col flex-grow">
                                <h3 class="font-bold text-slate-800 text-sm leading-tight mb-1">${item.name}</h3>
                                <p class="text-slate-400 text-[10px] leading-relaxed line-clamp-2 mb-3">${item.desc}</p>
                                <div class="mt-auto">
                                    <div class="w-full py-2.5 bg-slate-50 group-active:bg-red-50 rounded-xl text-slate-400 group-active:text-red-500 flex items-center justify-center transition-colors">
                                        <i class="fas fa-plus text-[10px]"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function setActiveNav(target, type) {
            document.querySelectorAll('.category-pill').forEach(btn => {
                btn.className = "category-pill whitespace-nowrap px-6 py-3 rounded-2xl font-bold text-sm bg-white text-slate-500 border border-slate-100";
            });
            target.className = "category-pill whitespace-nowrap px-6 py-3 rounded-2xl font-bold text-sm bg-red-500 text-white shadow-lg shadow-red-100";
            renderMenu(type);
        }

        function handleItemClick(name, price, hasTopping) {
            if (hasTopping) {
                currentToppingProduct = { name, price };
                document.getElementById('selected-product-name').innerText = name;
                document.querySelectorAll('.topping-checkbox').forEach(cb => cb.checked = false);
                document.getElementById('toppingModal').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } else {
                addToCart(name, price, []);
                showToast();
            }
        }

        function addWithTopping() {
            const checks = {
                yamin: { el: 'check-yamin', label: 'Yamin', price: 1000 },
                jamur: { el: 'check-jamur', label: 'Jamur', price: 5000 },
                rebus: { el: 'check-pangsit-rebus', label: 'Pangsit Rebus', price: 3000 },
                goreng: { el: 'check-pangsit-goreng', label: 'Pangsit Goreng', price: 5000 },
                sapi: { el: 'check-bakso-sapi', label: 'Bakso Sapi', price: 2000 },
                ikan: { el: 'check-bakso-ikan', label: 'Bakso Ikan', price: 3000 }
            };

            let toppings = [];
            for (let key in checks) {
                if(document.getElementById(checks[key].el).checked) {
                    toppings.push({ label: checks[key].label, price: checks[key].price });
                }
            }

            addToCart(currentToppingProduct.name, currentToppingProduct.price, toppings);
            closeModal('toppingModal');
            showToast();
        }

        function addToCart(name, price, toppings) {
            const toppingNames = toppings.map(t => t.label).join(" + ");
            const toppingPrice = toppings.reduce((acc, t) => acc + t.price, 0);
            const entryName = toppingNames ? `${name} + ${toppingNames}` : name;
            const totalPrice = price + toppingPrice;
            
            const existing = cart.find(i => i.fullName === entryName);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ fullName: entryName, unitPrice: totalPrice, quantity: 1 });
            }
            updateCartUI();
        }

        function openOrderModal() {
            const container = document.getElementById('cart-items-container');
            const totalDisplay = document.getElementById('cart-total-price');
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-slate-300">
                        <i class="fas fa-bag-shopping text-6xl mb-4 opacity-20"></i>
                        <p class="font-bold text-sm">Keranjang masih kosong</p>
                    </div>
                `;
            } else {
                cart.forEach((item, index) => {
                    const subtotal = item.unitPrice * item.quantity;
                    total += subtotal;
                    container.innerHTML += `
                        <div class="bg-slate-50 p-6 rounded-[30px] border border-white shadow-sm">
                            <div class="flex justify-between items-start mb-4">
                                <div class="flex-grow pr-4">
                                    <h4 class="font-bold text-slate-800 text-sm leading-tight">${item.fullName}</h4>
                                    <p class="text-red-500 font-bold text-xs mt-1">${formatCurrency(item.unitPrice)}</p>
                                </div>
                                <span class="font-black text-slate-900 text-sm whitespace-nowrap">${formatCurrency(subtotal)}</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="flex items-center bg-white rounded-2xl p-1 shadow-sm border border-slate-100">
                                    <button onclick="changeQty(${index}, -1)" class="w-10 h-10 flex items-center justify-center text-slate-400 active:scale-90">
                                        <i class="fas fa-minus text-xs"></i>
                                    </button>
                                    <span class="w-8 text-center font-black text-slate-800 text-sm">${item.quantity}</span>
                                    <button onclick="changeQty(${index}, 1)" class="w-10 h-10 flex items-center justify-center text-red-500 active:scale-90">
                                        <i class="fas fa-plus text-xs"></i>
                                    </button>
                                </div>
                                <button onclick="changeQty(${index}, -${item.quantity})" class="text-slate-300 hover:text-red-500 transition-colors">
                                    <i class="fas fa-trash-can text-sm"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }
            totalDisplay.innerText = formatCurrency(total);
            document.getElementById('orderModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function changeQty(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) cart.splice(index, 1);
            updateCartUI();
            openOrderModal();
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function sendToWhatsApp() {
            if (cart.length === 0) return;
            let total = 0;
            let message = "*PESANAN BAKMI MENTENG*\n\n";
            cart.forEach(item => {
                const subtotal = item.unitPrice * item.quantity;
                total += subtotal;
                message += `✅ *${item.fullName}*\n   ${item.quantity}x @ ${formatCurrency(item.unitPrice)}\n\n`;
            });
            message += `━━━━━━━━━━━━━━\n*TOTAL: ${formatCurrency(total)}*`;
            window.open(`https://wa.me/6281280906333?text=${encodeURIComponent(message)}`, '_blank');
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 2000);
        }

        window.onload = () => renderMenu();
    </script>
</body>
</html>
