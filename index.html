<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu | Bakmi Pangsit Menteng Pulo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-size: 10px; 
        }

        .text-main { font-size: 10px !important; }
        .menu-desc { font-size: 8px !important; line-height: 1.2; }
        
        ::-webkit-scrollbar { width: 0px; }

        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .menu-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.03);
            transition: transform 0.2s ease;
        }
        
        .menu-card:active { transform: scale(0.96); }

        .img-container {
            position: relative;
            padding: 4px;
        }

        .img-container img {
            border-radius: 12px;
            aspect-ratio: 1/1;
            object-fit: cover;
            width: 100%;
        }

        .category-pill {
            font-size: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-active {
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .topping-checkbox:checked + div {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .hide-item {
            display: none;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="text-slate-900">

    <nav class="fixed top-0 left-0 right-0 z-50 glass-header border-b border-slate-100">
        <div class="max-w-md mx-auto px-4 h-14 flex justify-between items-center">
            <div>
                <p class="font-bold text-slate-400 uppercase tracking-widest" style="font-size: 8px;">Daftar</p>
                <h1 class="font-black text-red-500 tracking-tighter leading-none" style="font-size: 16px;">MENU</h1>
            </div>
            <div class="relative">
                <button onclick="openOrderModal()" class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white relative active:scale-90 transition-transform">
                    <i class="fas fa-bag-shopping text-base"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white font-bold w-4 h-4 rounded-full border-2 border-white flex items-center justify-center hidden" style="font-size: 8px;">0</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="mobile-container pt-16 pb-28 px-3">
        <div class="flex justify-start items-center gap-2 pb-4 overflow-x-auto no-scrollbar" id="category-list">
            <button onclick="setActiveNav(this, 'all')" 
                class="category-pill whitespace-nowrap px-4 py-1.5 rounded-lg font-bold bg-red-500 text-white shadow-sm">
                Semua
            </button>
            <button onclick="setActiveNav(this, 'makanan')" 
                class="category-pill whitespace-nowrap px-4 py-1.5 rounded-lg font-bold bg-white text-slate-500 border border-slate-100">
                Makanan
            </button>
            <button onclick="setActiveNav(this, 'minuman')" 
                class="category-pill whitespace-nowrap px-4 py-1.5 rounded-lg font-bold bg-white text-slate-500 border border-slate-100">
                Minuman
            </button>       
        </div>
        <div id="menu-container" class="grid grid-cols-2 gap-3"></div>
    </main>

    <div id="sticky-cart-summary" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] z-40 hidden">

        <button onclick="openOrderModal()" class="w-full bg-slate-900 text-white p-3 rounded-2xl flex justify-between items-center shadow-xl active:scale-95 transition-all">
            <div class="flex items-center gap-2">
                <div class="bg-red-500 w-6 h-6 rounded-lg flex items-center justify-center font-bold" id="summary-count" style="font-size: 10px;">0</div>
                <span class="font-bold uppercase tracking-tight" style="font-size: 10px;">Lihat Pesanan</span>
            </div>
            <span class="font-bold" id="summary-total" style="font-size: 10px;">Rp 0</span>
        </button>

    </div>

    <div id="toppingModal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('toppingModal')"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] modal-active flex flex-col max-h-[85vh]">
            <div class="p-5 pb-2 flex justify-between items-center">
                <div>
                    <h3 class="font-black text-slate-900" style="font-size: 14px;">Pilihan Topping</h3>
                    <p id="selected-product-name" class="text-red-500 font-bold uppercase" style="font-size: 9px;"></p>
                </div>
                <button onclick="closeModal('toppingModal')" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-400">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>
            <div class="overflow-y-auto px-5 py-2">
                <div class="grid grid-cols-2 gap-2 mb-4" id="primary-topping">
                    <label class="relative cursor-pointer">
                        <input type="checkbox" id="check-yamin" class="hidden topping-checkbox">
                        <div class="p-3 border-2 border-slate-50 rounded-xl bg-slate-50 flex justify-between items-center">
                            <span class="font-bold text-slate-800" style="font-size: 10px;">Yamin</span>
                            <span class="text-red-500 font-bold" style="font-size: 8px;">+1k</span>
                        </div>
                    </label>

                    <label class="relative cursor-pointer">
                        <input type="checkbox" id="check-jamur" class="hidden topping-checkbox">
                        <div class="p-3 border-2 border-slate-50 rounded-xl bg-slate-50 flex justify-between items-center">
                            <span class="font-bold text-slate-800" style="font-size: 10px;">Extra Jamur</span>
                            <span class="text-red-500 font-bold" style="font-size: 8px;">+5k</span>
                        </div>
                    </label>
                </div>
                <div class="space-y-2 mb-6" id="additional-topping">
                    <label class="relative cursor-pointer block">
                        <input type="checkbox" id="check-pangsit-rebus" class="hidden topping-checkbox">
                        <div class="p-2 border-2 border-slate-50 rounded-xl bg-slate-50 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img src="img/topping-pangsit-rebus.jpeg" class="w-8 h-8 rounded-lg object-cover">
                                <span class="font-bold text-slate-800" style="font-size: 10px;">Pangsit Rebus</span>
                            </div>
                            <span class="text-red-500 font-bold" style="font-size: 8px;">+2k</span>
                        </div>
                    </label>

                    <label class="relative cursor-pointer block">
                        <input type="checkbox" id="check-pangsit-goreng" class="hidden topping-checkbox">
                        <div class="p-2 border-2 border-slate-50 rounded-xl bg-slate-50 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img src="img/topping-pangsit-goreng.jpeg" class="w-8 h-8 rounded-lg object-cover">
                                <span class="font-bold text-slate-800" style="font-size: 10px;">Pangsit Goreng</span>
                            </div>
                            <span class="text-red-500 font-bold" style="font-size: 8px;">+5k</span>
                        </div>
                    </label>

                    <label class="relative cursor-pointer block">
                        <input type="checkbox" id="check-bakso-sapi" class="hidden topping-checkbox">
                        <div class="p-2 border-2 border-slate-50 rounded-xl bg-slate-50 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img src="img/topping-bakso-sapi.jpeg" class="w-8 h-8 rounded-lg object-cover">
                                <span class="font-bold text-slate-800" style="font-size: 10px;">Bakso Sapi</span>
                            </div>
                            <span class="text-red-500 font-bold" style="font-size: 8px;">+2k</span>
                        </div>
                    </label>

                    <label class="relative cursor-pointer block">
                        <input type="checkbox" id="check-bakso-ikan" class="hidden topping-checkbox">
                        <div class="p-2 border-2 border-slate-50 rounded-xl bg-slate-50 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img src="img/topping-bakso-ikan.jpeg" class="w-8 h-8 rounded-lg object-cover">
                                <span class="font-bold text-slate-800" style="font-size: 10px;">Bakso Ikan</span>
                            </div>
                            <span class="text-red-500 font-bold" style="font-size: 8px;">+3k</span>
                        </div>
                    </label>
                </div>
            </div>
            <div class="p-5 bg-slate-50">
                <button onclick="addWithTopping()" class="w-full bg-red-500 text-white py-3.5 rounded-xl font-black uppercase tracking-widest shadow-lg active:scale-95 transition-all" style="font-size: 10px;">Tambahkan Keranjang</button>
            </div>
        </div>
    </div>

    <div id="orderModal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('orderModal')"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] modal-active flex flex-col h-[80vh]">
            <div class="p-5 flex justify-between items-center border-b border-slate-50">
                <h3 class="font-black text-slate-900" style="font-size: 14px;">Pesanan Saya</h3>
                <button onclick="closeModal('orderModal')" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-400">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>
            <div id="cart-items-container" class="flex-grow overflow-y-auto p-5 space-y-3">
                </div>
            <div class="p-5 bg-slate-50 border-t border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-slate-400 font-bold uppercase" style="font-size: 10px;">Total Bayar</span>
                    <span id="cart-total-price" class="font-black text-red-500" style="font-size: 14px;">Rp 0</span>
                </div>
                <button onclick="sendToWhatsApp()" class="w-full bg-green-500 text-white py-3.5 rounded-xl font-black uppercase tracking-widest shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-all" style="font-size: 10px;">
                    <i class="fab fa-whatsapp text-sm"></i>
                    Kirim via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-[110] bg-slate-900 text-white px-4 py-2 rounded-full shadow-xl hidden items-center gap-2">
        <i class="fas fa-check-circle text-green-400 text-xs"></i>
        <span class="font-bold" style="font-size: 9px;">Berhasil ditambahkan!</span>
    </div>

    <footer class="bg-white py-4 px-4 text-center">
        <div class="w-20 h-1 bg-slate-100 mx-auto mb-8 rounded-full"></div>
        <p class="text-slate-400 font-normal leading-relaxed">
            &copy; 2026 Bakmi Pangsit Menteng Pulo
        </p>
    </footer>

    <script>
        let cart = [];
        let currentToppingProduct = null;

        const menuData = [
            {
                type: "makanan",
                items: [
                    { name: "Bakmi Ayam", price: 15000, desc: "Mie varian khas, ayam dadu, sawi, dan daun bawang dengan kuah kaldu.", img: "img/bakmi-ayam.jpeg", hasTopping: true },
                    { name: "Bakmi Bangka", price: 15000, desc: "Mie keriting, ayam halus, taoge, acar cabai, sawi, dan daun bawang dengan kuah kaldu.", img: "img/bakmi-bangka.jpeg", hasTopping: true },
                    { name: "Bakmi Lebar", price: 16000, desc: "Mie lebar, ayam dadu, sawi, dan daun bawang dengan kuah kaldu.", img: "img/bakmi-lebar.jpeg", hasTopping: true },
                    { name: "Kwetiau", price: 16000, desc: "Kwetiau khas, ayam dadu, sawi, dan daun bawang dengan kuah kaldu.", img: "img/kwetiau.jpeg", hasTopping: true },
                    { name: "Bihun", price: 16000, desc: "Bihun khas, ayam dadu, sawi, dan daun bawang dengan kuah kaldu ayam.", img: "img/bihun.jpeg", hasTopping: true },
                    { name: "Pangsit Kuah", price: 18000, desc: "Pangsit rebus isi 10, ayam dadu, sawi, dan daun bawang dengan kuah kaldu.", img: "img/pangsit-kuah.jpeg", hasTopping: false },
                    { name: "Pangsit Kuah 1/2", price: 10000, desc: "Pangsit rebus isi 5, ayam dadu, sawi, dan daun bawang dengan kuah kaldu.", img: "img/pangsit-kuah-set.jpeg", hasTopping: false },
                    { name: "Bakso Campur", price: 18000, desc: "Bakso sapi 5 & ikan 4, bawang goreng, dan seledri dengan kuah kaldu.", img: "img/bakso-campur.jpeg", hasTopping: false },
                    { name: "Bakso Sapi", price: 16000, desc: "Bakso sapi isi 10, bawang goreng, dan seledri dengan kuah kaldu.", img: "img/bakso-sapi.jpeg", hasTopping: false },
                    { name: "Bakso Sapi 1/2", price: 8000, desc: "Bakso sapi isi 5, bawang goreng, dan seledri dengan kuah kaldu.", img: "img/bakso-sapi-set.jpeg", hasTopping: false },
                    { name: "Bakso Ikan", price: 18000, desc: "Bakso ikan isi 8, bawang goreng, dan seledri dengan kuah kaldu.", img: "img/bakso-ikan.jpeg", hasTopping: false },
                    { name: "Bakso Ikan 1/2", price: 10000, desc: "Bakso ikan isi 4, bawang goreng, dan seledri dengan kuah kaldu.", img: "img/bakso-ikan-set.jpeg", hasTopping: false },
                    { name: "Pangsit Goreng", price: 26000, desc: "Pangsit goreng isi 8, kulit pangsit dengan isian daging ayam halus.", img: "img/pangsit-goreng.jpeg", hasTopping: false },
                    { name: "Pangsit Goreng 1/2", price: 14000, desc: "Pangsit goreng isi 4, kulit pangsit dengan isian daging ayam halus.", img: "img/pangsit-goreng-set.jpeg", hasTopping: false },
                    { name: "Pangsit Kuah Dua", price: 5000, desc: "Pangsit rebus isi 2, ayam dadu, sawi, dan daun bawang dengan kuah kaldu.", img: "img/topping-pangsit-rebus.jpeg", hasTopping: false },
                    { name: "Pangsit Goreng Dua", price: 7000, desc: "Pangsit goreng isi 2, kulit pangsit dengan isian daging ayam halus.", img: "img/topping-pangsit-goreng.jpeg", hasTopping: false },
                    { name: "Bakso Sapi Dua", price: 4000, desc: "Bakso sapi isi 2, bawang goreng, dan seledri dengan kuah kaldu.", img: "img/topping-bakso-sapi.jpeg", hasTopping: false },
                    { name: "Bakso Ikan Dua", price: 5000, desc: "Bakso ikan isi 2, bawang goreng, dan seledri dengan kuah kaldu.", img: "img/topping-bakso-ikan.jpeg", hasTopping: false },
                    { name: "Kerupuk Putih", price: 2000, desc: "Kerupuk mawah putih isi 1", img: "img/kerupuk-mawar.jpeg", hasTopping: false },
                ]
            },
            {
                type: "minuman",
                items: [
                    { name: "Teh Tawar", price: 2000, desc: "Minuman teh tawar air hangat", img: "img/teh-tawar.jpeg", hasTopping: false },
                    { name: "Teh Manis", price: 4000, desc: "Minuman teh manis air hangat", img: "img/teh-manis.jpeg", hasTopping: false },
                    { name: "Es Teh Tawar", price: 2000, desc: "Minuman es teh tawar air dingin", img: "img/es-teh-tawar.jpeg", hasTopping: false },
                    { name: "Es Teh Manis", price: 4000, desc: "Minuman es teh manis air dingin", img: "img/es-teh-manis.jpeg", hasTopping: false },
                    { name: "Es Air Putih", price: 2000, desc: "Minuman es air putih dingin", img: "img/es-air-putih.jpeg", hasTopping: false },
                    { name: "Es Good Day Cappucino", price: 5000, desc: "Minuman es good day cappucino", img: "img/goodday-cappucino.jpeg", hasTopping: false },
                    { name: "Kopi Hitam", price: 5000, desc: "Minuman kopi hitam air panas", img: "img/kopi-hitam.jpeg", hasTopping: false },
                    { name: "Air Mineral Oasis", price: 3000, desc: "Minuman botol air mineral 600 ml", img: "img/air-mineral-oasis.jpeg", hasTopping: false },
                    { name: "Teh Pucuk", price: 5000, desc: "Minuman botol teh pucuk 350 ml", img: "img/teh-pucuk.jpeg", hasTopping: false },
                    { name: "S-tee", price: 5000, desc: "Minuman botol s-tee 390 ml", img: "img/s-tee.jpeg", hasTopping: false },
                ]
            }
        ];

        function formatCurrency(num) { return "Rp " + num.toLocaleString('id-ID'); }

        function renderMenu(filter = 'all') {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            menuData.forEach(group => {
                if (filter !== 'all' && group.type !== filter) return;
                group.items.forEach(item => {
                    container.innerHTML += `
                        <div class="menu-card flex flex-col shadow-sm">
                            <div class="img-container">
                                <img src="${item.img}" alt="${item.name}">
                                <div class="absolute top-2 right-2 bg-white/90 px-1.5 py-0.5 rounded-lg border border-slate-50">
                                    <span class="font-black text-red-500" style="font-size: 9px;">${item.price/1000}k</span>
                                </div>
                            </div>
                            <div class="p-3 pt-1 flex flex-col flex-grow">
                                <h3 class="font-bold text-slate-800 mb-1 leading-tight" style="font-size: 10px;">${item.name}</h3>
                                <p class="menu-desc text-slate-400 line-clamp-2 mb-2">${item.desc}</p>
                                <div class="mt-auto">
                                    <div onclick="handleItemClick('${item.name}', ${item.price}, ${item.hasTopping})"
                                        class="w-full py-1.5 bg-red-500 rounded-lg text-white flex items-center justify-center cursor-pointer active:bg-red-600">
                                        <span class="font-bold uppercase tracking-tighter" style="font-size: 9px;">Tambah</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
        }
        
        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const summary = document.getElementById('sticky-cart-summary');
            const summaryCount = document.getElementById('summary-count');
            const summaryTotal = document.getElementById('summary-total');
            const totalItems = cart.reduce((acc, curr) => acc + curr.quantity, 0);
            const totalPrice = cart.reduce((acc, curr) => acc + (curr.unitPrice * curr.quantity), 0);

            badge.innerText = totalItems;
            summaryCount.innerText = totalItems;
            summaryTotal.innerText = formatCurrency(totalPrice);

            if(totalItems > 0) {
                badge.classList.remove('hidden');
                summary.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
                summary.classList.add('hidden');
            }
        }

        function setActiveNav(target, type) {
            document.querySelectorAll('.category-pill').forEach(btn => {
                btn.className = "category-pill whitespace-nowrap px-4 py-1.5 rounded-lg font-bold bg-white text-slate-500 border border-slate-100";
            });
            target.className = "category-pill whitespace-nowrap px-4 py-1.5 rounded-lg font-bold bg-red-500 text-white shadow-sm";
            renderMenu(type);
        }

        function addToCart(name, price, toppings) {
            const toppingNames = toppings.map(t => t.label).join(" + ");
            const toppingPrice = toppings.reduce((acc, t) => acc + t.price, 0);
            const entryName = toppingNames ? `${name} + ${toppingNames}` : name;
            const totalPrice = price + toppingPrice;
            const existing = cart.find(i => i.fullName === entryName);
            if (existing) { existing.quantity += 1; } 
            else { cart.push({ fullName: entryName, unitPrice: totalPrice, quantity: 1 }); }
            updateCartUI();
        }

        function resetToppings() {
            const checkboxes = document.querySelectorAll('.topping-checkbox');
            checkboxes.forEach(cb => cb.checked = false);
        }

        function handleItemClick(name, price, hasTopping) {
            if (hasTopping) {
                resetToppings();
                currentToppingProduct = { name, price };
                document.getElementById('selected-product-name').innerText = name;
                document.getElementById('toppingModal').classList.remove('hidden');
            } else {
                addToCart(name, price, []);
                showToast();
            }
        }

        function addWithTopping() {
            const toppings = [];
            const toppingOptions = [
                { id: 'check-yamin', label: 'Yamin', price: 1000 },
                { id: 'check-jamur', label: 'Extra Jamur', price: 5000 },
                { id: 'check-pangsit-rebus', label: 'Pangsit Rebus', price: 2000 },
                { id: 'check-pangsit-goreng', label: 'Pangsit Goreng', price: 5000 },
                { id: 'check-bakso-sapi', label: 'Bakso Sapi', price: 2000 },
                { id: 'check-bakso-ikan', label: 'Bakso Ikan', price: 3000 }
            ];

            toppingOptions.forEach(opt => {
                const el = document.getElementById(opt.id);
                if (el && el.checked) {
                    toppings.push({ label: opt.label, price: opt.price });
                }
            });

            addToCart(currentToppingProduct.name, currentToppingProduct.price, toppings);
            closeModal('toppingModal');
            showToast();
        }

        function openOrderModal() {
            const container = document.getElementById('cart-items-container');
            const totalDisplay = document.getElementById('cart-total-price');
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-10 opacity-30">
                        <i class="fas fa-shopping-basket text-4xl mb-2"></i>
                        <p class="font-bold uppercase tracking-widest" style="font-size: 10px;">Keranjang kosong</p>
                    </div>`;
            } else {
                cart.forEach((item, index) => {
                    const subtotal = item.unitPrice * item.quantity;
                    total += subtotal;
                    container.innerHTML += `
                        <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex flex-col gap-2">
                            <div class="flex justify-between items-start">
                                <div class="flex-grow">
                                    <h4 class="font-black text-slate-800 leading-tight" style="font-size: 10px;">${item.fullName}</h4>
                                    <p class="hide-item text-slate-400 font-medium" style="font-size: 8px;">${formatCurrency(item.unitPrice)} / porsi</p>
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center mt-1 pt-2 border-t border-dashed border-slate-100">
                                <div class="flex items-center gap-3 bg-slate-50 rounded-lg px-2 py-1">
                                    <button onclick="changeQty(${index}, -1)" class="w-5 h-5 flex items-center justify-center bg-white border border-slate-200 rounded-md active:bg-slate-100">
                                        <i class="fas fa-minus text-[8px]"></i>
                                    </button>
                                    <span class="font-black text-slate-800" style="font-size: 10px;">${item.quantity}</span>
                                    <button onclick="changeQty(${index}, 1)" class="w-5 h-5 flex items-center justify-center bg-red-500 text-white rounded-md active:bg-red-600">
                                        <i class="fas fa-plus text-[8px]"></i>
                                    </button>
                                </div>
                                <div class="text-right">
                                    <p class="text-red-500 font-black" style="font-size: 10px;">${formatCurrency(subtotal)}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            totalDisplay.innerText = formatCurrency(total);
            document.getElementById('orderModal').classList.remove('hidden');
        }

        function changeQty(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) cart.splice(index, 1);
            updateCartUI();
            openOrderModal();
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden'); toast.classList.add('flex');
            setTimeout(() => { toast.classList.add('hidden'); toast.classList.remove('flex'); }, 2000);
        }

        function sendToWhatsApp() {
            if (cart.length === 0) return;
            let total = 0;
            let message = "*Pesanan Baru:*\n\n";
            cart.forEach((item, index) => {
                total += item.unitPrice * item.quantity;
                message += `${index + 1}. ${item.fullName} (${item.quantity}x)\n`;
            });
            message += `\n*TOTAL: ${formatCurrency(total)}*`;
            window.open(`https://wa.me/6281280666370?text=${encodeURIComponent(message)}`, '_blank');
        }

        window.onload = () => renderMenu();
    </script>
</body>
</html>
